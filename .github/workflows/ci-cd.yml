name: CI/CD — pfm-ingestion-bff-go & 1:1 IaC Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  unit-tests-and-race-detector:
    name: Go 1.24 Unit Tests & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Execute Unit Tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.txt ./...

  security-scans:
    name: SAST & Secret Scanning (Gitleaks + Semgrep + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/owasp-top-ten
            p/terraform

      - name: Run Trivy IaC & Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  build-distroless-image:
    name: Build & Scan Distroless OCI Image
    needs: [unit-tests-and-race-detector, security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Multi-Stage Distroless Image
        run: |
          docker build -t ghcr.io/sorobanerp/pfm-ingestion-bff-go:${{ github.sha }} .

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/sorobanerp/pfm-ingestion-bff-go:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
