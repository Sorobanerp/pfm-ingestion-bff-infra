ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 8080
  service: 80
# FinOps Minimum Footprint for 5-User Family Pilot (~US$ 8/mo GCP / ~US$ 41/mo AWS)
replicaCount: 1

image:
  repository: ghcr.io/dantas-pfm/pfm-ingestion-bff-go
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  httpPort: 80

env:
  SERVER_PORT: "8080"
  KAFKA_BROKERS: "pfm-kafka.pfm-platform.svc.cluster.local:9092"
  CORE_LEDGER_GRPC_ADDR: "pfm-core-ledger-java.pfm-platform.svc.cluster.local:9090"
  CORE_LEDGER_HTTP_URL: "http://pfm-core-ledger-java.pfm-platform.svc.cluster.local:8080"
  FORECAST_GRPC_ADDR: "pfm-forecast-engine-go:9090"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "150m"
    memory: "128Mi"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
