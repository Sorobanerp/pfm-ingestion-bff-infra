apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pfm-ingestion-bff-go-hpa
  namespace: pfm-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pfm-ingestion-bff-go
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
