apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfm-ingestion-bff-go
  namespace: pfm-platform
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Tag imutavel v0.1.0 gerenciada pelo pipeline GitOps"
  labels:
    app: pfm-ingestion-bff-go
    tags.datadoghq.com/service: "pfm-ingestion-bff-go"
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/version: "0.1.0"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pfm-ingestion-bff-go
  template:
    metadata:
      labels:
        app: pfm-ingestion-bff-go
        tags.datadoghq.com/service: "pfm-ingestion-bff-go"
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pfm-ingestion-bff-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.ports.container }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
