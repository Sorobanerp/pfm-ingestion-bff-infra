apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfm-ingestion-bff-go
  namespace: pfm-platform
  labels:
    app: pfm-ingestion-bff-go
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pfm-ingestion-bff-go
  template:
    metadata:
      labels:
        app: pfm-ingestion-bff-go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: pfm-ingestion-bff-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
