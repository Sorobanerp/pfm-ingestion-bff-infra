ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 8080
  service: 80
replicaCount: 2
image:
  repository: ghcr.io/dantas-pfm/pfm-ingestion-bff-go
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  httpPort: 80
env:
  SERVER_PORT: "8080"
  LOCALSTACK_ENDPOINT: "http://localstack:4566"
  KAFKA_BROKERS: "pfm-kafka.pfm-platform.svc.cluster.local:9092"
  CORE_LEDGER_GRPC_ADDR: "pfm-core-ledger-java.pfm-platform.svc.cluster.local:9090"
  CORE_LEDGER_HTTP_URL: "http://pfm-core-ledger-java.pfm-platform.svc.cluster.local:8080"
  FORECAST_GRPC_ADDR: "pfm-forecast-engine-go:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent.monitoring.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "pfm-ingestion-bff-go"
  DD_LOGS_INJECTION: "true"
  DD_SERVICE: "pfm-ingestion-bff-go"
  DD_ENV: "production"
  DD_VERSION: "0.1.0"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
