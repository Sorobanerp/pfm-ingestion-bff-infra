ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 18100
  service: 80
replicaCount: 1

image:
  repository: sorobanerp/pfm-ingestion-bff-go
  tag: local
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: pfm-ingestion-bff-go-sa

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "250m"
    memory: "128Mi"
  limits:
    cpu: "1000m"
    # Strict RAM ceiling aligned with Zero-Disk 15MB PDF stream parsing (ADR-006)
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 18100
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 18100
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

env:
  SERVER_PORT: "18100"
  LOCALSTACK_ENDPOINT: "http://pfm-localstack:4566"
  KAFKA_BROKERS: "pfm-kafka:29092"
  CORE_LEDGER_GRPC_ADDR: "pfm-core-ledger-java:9090"
  CORE_LEDGER_HTTP_URL: "http://pfm-core-ledger-java:8080"
  FORECAST_GRPC_ADDR: "pfm-forecast-engine-go:9090"
  OTEL_SERVICE_NAME: "pfm-ingestion-bff-go"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_TRACES_SAMPLER: "always_on"
